name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
env:
  PYTHONUTF8: "1"
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
  docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker pull python:3.13-slim
      - run: python -m unittest discover -s tests -p test_crossplatform.py -v
        env:
          EDU_RUN_DOCKER_TESTS: '1'
          EDU_CODE_BACKEND: docker
